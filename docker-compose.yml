services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-floodscout}
      POSTGRES_USER: ${DB_USER:-floodscout}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # This computer only: "5432:5432" would let anyone on the same network
      # sign in to the database. The web and scheduler containers reach it
      # as "db" over Compose's own network and do not need this at all.
      # DB_HOST_PORT moves it when a Postgres installed on the computer
      # already owns 5432 (then the bind fails and the db never starts).
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-floodscout}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      # Earth Engine credential from `earthengine authenticate`, kept out of git.
      - ./.secrets/earthengine:/root/.config/earthengine
    ports:
      # Host port is configurable: 8000 is often already taken (on Windows a
      # vendor service frequently squats on it), and a bind clash leaves the
      # container stuck in "created" with no obvious error. Set WEB_PORT in
      # .env to move it; the container always listens on 8000 internally.
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Keeps the dashboard current: fetches the latest rainfall and rescores
  # every region when it starts and once a day after that.
  scheduler:
    build: .
    restart: unless-stopped
    command: python manage.py refresh_scores --every-hours 24
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Print each step as it happens, so `docker compose logs scheduler`
      # shows the refresh in progress instead of nothing until a buffer fills.
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgis_data:
