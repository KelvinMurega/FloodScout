# Baseline for hazard_rf_era5_soil_20261115.toml: the same procedure and
# folds on the same rows without soil moisture, so the two can be compared
# (riskengine/ml/README.md, "How a change is judged"). Not a candidate.
#
#   python -m riskengine.ml.pipeline train --model hazard #       --config riskengine/ml/configs/hazard_rf_era5_20261115.toml

model = "hazard"

[data]
# Point ERA5 rainfall every year, built 15 October 2026.
training_set = "data/processed/training_set.csv"
sha256 = "cb06cd3a3b1f43417c649d56c6ebfe911ae0dbae3c3b5745e8aee7e9ac8f4db4"
first_year = 1996
features = [
    "rain_30d",
    "rain_7d_max",
    "rain_prev_30d",
    "rain_30d_ratio",
    "oni",
    "dmi",
    "oni_short_rains",
    "dmi_short_rains",
    "month_sin",
    "month_cos",
    "elevation",
    "slope",
    "log_area",
]

[cv]
scheme = "group-k-fold-by-year"
folds = 6
# The 2017 to 2021 final test was looked at about seven times and was closed
# on 29 October 2026. The pipeline refuses any other value.
final_test = "closed"

[selection]
tune = true
random_state = 0
seeds = [0, 1, 2, 3, 4]
probability_bands = [0.05, 0.10, 0.20]

[selection.grids.logreg]
"logisticregression__C" = [0.01, 0.1, 1.0, 10.0]

[selection.grids.random-forest]
"randomforestclassifier__min_samples_leaf" = [5, 20, 50]
"randomforestclassifier__max_features" = ["sqrt", 0.5]

[selection.grids.gradient-boosting]
"gradientboostingclassifier__max_depth" = [2, 3]
"gradientboostingclassifier__learning_rate" = [0.02, 0.05, 0.1]

[promotion]
# How a challenger is judged against the champion, on the same training set
# and folds (riskengine/ml/README.md, "How a change is judged").
primary_metric = "average_precision"
margin = 0.01
