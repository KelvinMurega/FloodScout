# Susceptibility model, version 1. Every value here comes from
# riskengine/ml/SUSCEPTIBILITY_PROTOCOL.md, which wins if the two disagree.
#
# Committed before any pixel was sampled. The pipeline learns this model name
# with the susceptibility code.

model = "susceptibility"
protocol = "riskengine/ml/SUSCEPTIBILITY_PROTOCOL.md"
protocol_version = 1

[data]
training_set = "data/processed/susceptibility_sample_v1.csv"
sha256 = "7d45d82705eabdb5060db9b1fe3ea3932938ef1721418ae610f3d9ee5d24119c"
labels = "GLOBAL_FLOOD_DB/MODIS_EVENTS/V1"
pixel_metres = 250
min_flooded_pixels_per_event = 200
flooded_pixels_per_event = 3000
dry_pixels_per_event = 3000
min_clear_perc = 0.5
permanent_water_occurrence = 90
sampling_seed = 20261029
features = [
    "hand",
    "twi",
    "log_upa",
    "dist_river",
    "elev",
    "slope",
    "flood_zone_100y",
]

[derived]
slope_floor_degrees = 0.1
river_upstream_km2 = 100

[cv]
primary = "leave-one-event-out"
guard = "block"
block_degrees = 0.5
block_folds = 5

[metrics]
primary = "within-county-roc-auc"
min_flooded_per_county_event = 20
min_dry_per_county_event = 20
calibration_bins = 10

[selection]
seeds = [0, 1, 2, 3, 4]
baselines = ["hand", "flood-zone-100y", "distance-to-river"]

[selection.grids.logreg]
"logisticregression__C" = [0.01, 0.1, 1.0, 10.0]

[selection.grids.hist-gradient-boosting]
learning_rate = [0.05, 0.1]
max_leaf_nodes = [15, 31]
max_iter = [300]
min_samples_leaf = [100]
early_stopping = [false]

[promotion]
primary_metric = "within_county_roc_auc"
# Ship the model only if it beats the best baseline by this much on event CV
# and is not below that baseline on block CV.
margin = 0.03

[sensitivity.lakes]
# A second score, reported beside the primary one. It never enters the decision.
# Lake Turkana and the soda lakes rise and fall, so their shores can pass the
# permanent-water mask. Fixed on 1 November 2026, before anything was scored:
# drop pixels within this distance of a water body of this size that holds
# water in at least this share of observations.
occurrence = 25
min_area_km2 = 10
buffer_metres = 2000

[test]
events = ["FL20231124KEN", "FL20240426KEN"]
looks_per_shipped_version = 1
