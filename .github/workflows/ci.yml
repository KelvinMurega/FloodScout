name: CI

# Runs on every pull request into develop and main (docs/GAP_CLOSURE_PLAN.md,
# Phase 5), and by hand from the Actions tab.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rules are in ruff.toml. The version is pinned so a new ruff release
      # can not fail a pull request that changed nothing.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"

  dashboard:
    name: Tests and build (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The unit tests use Node's own test runner and need no packages.
      - name: Run the tests
        run: npm test
      - name: Build the dashboard
        run: npm ci && npm run build

  test:
    name: Tests (Django + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The same docker-compose.yml used in development: the project's
      # Dockerfile supplies GDAL/GEOS/PROJ and the db service is
      # postgis/postgis:16-3.4, so CI tests what a developer runs locally.
      - name: Use the example environment
        run: cp .env.example .env

      - name: Build the web image
        run: docker compose build web

      - name: Check for model changes without a migration
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: docker compose run --rm web python manage.py test
