name: CI

# Runs on every pull request into develop and main, and by hand from the
# Actions tab.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rules are in ruff.toml. The version is pinned so a new ruff release
      # can not fail a pull request that changed nothing.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.10"

  dashboard:
    name: Tests and build (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The unit tests use Node's own test runner and need no packages.
      - name: Run the tests
        run: npm test
      - name: Build the dashboard
        run: npm ci && npm run build
      # Known vulnerabilities in the dashboard's packages, high or worse.
      - name: Audit the packages
        run: npm audit --audit-level=high

  audit:
    name: Audit (Python packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Checks the exact versions in requirements.lock against the Python
      # advisory database, without installing them.
      - name: Check for known vulnerabilities
        run: |
          pip install "pip-audit>=2.7,<3"
          pip-audit -r requirements.lock --require-hashes --disable-pip

  test:
    name: Tests (Django + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The same docker-compose.yml used in development: the project's
      # Dockerfile supplies GDAL/GEOS/PROJ and the db service is
      # postgis/postgis:16-3.4, so CI tests what a developer runs locally.
      - name: Use the example environment
        run: cp .env.example .env

      - name: Build the web image
        run: docker compose build web

      - name: Check for model changes without a migration
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: docker compose run --rm web python manage.py test

      # Django's own list of production mistakes, with the settings the
      # server uses (.env.production.example). Warnings fail the step; the
      # two left on purpose are silenced, with reasons, in settings.py.
      - name: Check the production settings
        run: >
          docker compose run --rm
          -e DJANGO_DEBUG=False
          -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          -e DJANGO_ALLOWED_HOSTS=api.floodscout.me
          -e DJANGO_SECURE_COOKIES=True
          -e DJANGO_HSTS_SECONDS=3600
          -e DJANGO_NUM_PROXIES=1
          web python manage.py check --deploy --fail-level WARNING

      - name: Check the production Compose file
        run: API_HOST=api.floodscout.me docker compose -f docker-compose.prod.yml config --quiet

      - name: Check the Caddyfile
        run: >
          docker run --rm -e API_HOST=api.floodscout.me
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.8.4 caddy adapt --config /etc/caddy/Caddyfile > /dev/null
